<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Outer ambient aura glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop shadow for central emblem -->
    <filter id="emblem-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <!-- Main dynamic sphere gradient -->
    <linearGradient id="primary-grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glass specular overlay -->
    <linearGradient id="glass-specular" x1="64" y1="8" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Inner rim light -->
    <linearGradient id="rim-light" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Bolt gradient -->
    <linearGradient id="bolt-grad" x1="64" y1="26" x2="64" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
  </defs>

  <!-- Ambient background glow disc -->
  <circle cx="64" cy="64" r="54" fill="#2563eb" opacity="0.18" filter="url(#glow)" />

  <!-- Base Spherical Badge -->
  <circle cx="64" cy="64" r="52" fill="url(#primary-grad)" />

  <!-- Glass Specular Reflection Highlight (Upper Arch) -->
  <path d="M16 60 C 20 30, 40 14, 64 14 C 88 14, 108 30, 112 60 C 96 46, 76 40, 64 40 C 52 40, 32 46, 16 60 Z" fill="url(#glass-specular)" />

  <!-- Subtle Inner Border Rim -->
  <circle cx="64" cy="64" r="51.5" stroke="url(#rim-light)" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Academic Hyperfocus Lightning Bolt Emblem -->
  <path d="M 68 24 
           L 38 66 
           L 60 66 
           L 54 104 
           L 90 56 
           L 68 56 
           Z" 
        fill="url(#bolt-grad)" 
        filter="url(#emblem-shadow)" 
        stroke="#ffffff" 
        stroke-width="1.2" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Kinetic Spark Accent -->
  <circle cx="86" cy="36" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="44" cy="92" r="1.8" fill="#e0f2fe" opacity="0.75" />
</svg>
