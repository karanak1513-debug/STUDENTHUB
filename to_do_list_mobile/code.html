        }
        /* Custom Checkbox styles */
        .task-checkbox:checked + div {
            background-color: #3525cd;
            border-color: #3525cd;
        }
        .task-checkbox:checked + div > span {
            opacity: 1;
        }
        .task-completed .task-title {
            text-decoration: line-through;
            opacity: 0.4;

<body class="bg-background text-on-background h-full font-body-sm flex flex-col antialiased">

<h1 class="font-headline-md text-headline-md font-bold text-on-surface">To-Do</h1>
<div class="flex items-center gap-md">
<button aria-label="Search" class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:opacity-70">
<span class="material-symbols-outlined">search</span>
</button>
<button aria-label="Settings" class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:opacity-70">
<span class="material-symbols-outlined">settings</span>

<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant">

</div>
</div>

<!-- Main Content Area -->

<div class="flex gap-sm overflow-x-auto pb-sm mb-md scrollbar-hide -mx-margin-mobile px-margin-mobile snap-x">

                All Tasks
            </button>
<button class="snap-start flex-shrink-0 bg-surface-container-high text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap hover:bg-surface-variant transition-colors active:opacity-80 border border-outline-variant">
                Today
            </button>
<button class="snap-start flex-shrink-0 bg-surface-container-high text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap hover:bg-surface-variant transition-colors active:opacity-80 border border-outline-variant">
                CS101
            </button>
<button class="snap-start flex-shrink-0 bg-surface-container-high text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap hover:bg-surface-variant transition-colors active:opacity-80 border border-outline-variant">
                MATH202
            </button>
<button class="snap-start flex-shrink-0 bg-surface-container-high text-on-surface-variant font-label-md text-label-md px-4 py-2 rounded-full whitespace-nowrap hover:bg-surface-variant transition-colors active:opacity-80 border border-outline-variant">
                Reading
            </button>
</div>
<!-- Task List -->
<div class="flex flex-col gap-sm">
<!-- Task Card 1 (High Priority/Overdue styling - implied by Coral/Amber notes in guidelines) -->

</div>
<div class="flex-1 flex flex-col gap-xs">

<span class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-xs">

<span class="material-symbols-outlined text-white text-[16px] opacity-1 transition-opacity">check</span>
</div>
<div class="flex-1 flex flex-col gap-xs">

<span class="font-label-sm text-label-sm bg-primary/10 text-primary px-2 py-0.5 rounded-sm">CS101</span>
</div>

<span class="material-symbols-outlined mb-1 group-active:scale-95 transition-transform">ads_click</span>
<span class="truncate w-full text-center">Goals</span>
</button>
</nav>
<script>
        // Simple script to handle checkbox toggling for visual 'ghost state'
        document.querySelectorAll('label').forEach(label => {
            const checkbox = label.querySelector('input[type="checkbox"]');
            if(checkbox) {
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        label.classList.add('task-completed');
                    } else {
                        label.classList.remove('task-completed');
                    }
                });
            }
        });
    </script>
</body></html>
